[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifdd-meta"
# Set with the first release; the scheme is YY.MM.N.
version = "0.0.0"
description = "Build, run and test a complete IFDD installation from the ifdd-de templates"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
maintainers = [{ name = "ifdd.de contributors", email = "maintainers@ifdd.de" }]

dependencies = [
    "cruft~=2.16.0",
    "typer~=0.29.1",
    "PyYAML~=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "ruff~=0.17.5",
]

[project.urls]
Homepage = "https://ifdd.de/"
Repository = "https://github.com/ifdd-de/meta"

[project.scripts]
ifdd-meta = "ifdd_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
