name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  config:
    name: config (demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Generated files are up to date
        run: ifdd-meta compile --check config/demo/installation.yaml

      - name: Variables file against the templates
        run: ifdd-meta --settings config/demo/ifdd-meta.yaml config check

      # Every template renders with the generated variables, at its reference in
      # the demo; the hooks run as the (unprivileged) runner user.
      - name: Render every template
        run: |
          for service in proxy keycloak be ui schema type unit ct ts ts-api wf model; do
            ref=$(python -c 'import sys, yaml; t = yaml.safe_load(open("config/demo/ifdd-meta.yaml"))["templates"]; print(t.get("refs", {}).get(sys.argv[1], t["ref"]))' "$service")
            echo "::group::$service@$ref"
            cookiecutter --no-input --checkout "$ref" \
              --config-file config/demo/cookiecutter_all.yaml \
              --output-dir rendered "https://github.com/ifdd-de/$service"
            echo "::endgroup::"
          done
          if grep -rl --exclude=test_config.py 'cookiecutter\.' rendered; then
            echo "unrendered cookiecutter variables"; exit 1
          fi

  # Instances created at an older release and updated with 'ifdd-meta update'
  # must equal instances created fresh at the demo's references. No Docker:
  # create and update only render (cruft, hooks, the local CA).
  update:
    name: update (demo)
    runs-on: ubuntu-latest
    env:
      OLD_REF: v26.11.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          git config --global user.name "ifdd-meta CI"
          git config --global user.email "ci@example.org"

      - name: Create at the older release
        run: |
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/fresh"
          python - "$RUNNER_TEMP/old/installation.yaml" <<'PY'
          import os, sys, yaml
          description = yaml.safe_load(open("config/demo/installation.yaml"))
          description["templates"] = {"ref": os.environ["OLD_REF"]}
          yaml.safe_dump(description, open(sys.argv[1], "w"), sort_keys=False)
          PY
          cd "$RUNNER_TEMP/old"
          ifdd-meta compile installation.yaml
          ifdd-meta create

      - name: Update to the demo's references
        run: |
          cp config/demo/installation.yaml "$RUNNER_TEMP/old/installation.yaml"
          cp config/demo/installation.yaml "$RUNNER_TEMP/fresh/installation.yaml"
          cd "$RUNNER_TEMP/old"
          ifdd-meta compile installation.yaml
          ifdd-meta update --check
          ifdd-meta update
          ifdd-meta update --check | tee check.txt
          ! grep -q 'would update' check.txt

      - name: Same as a fresh create
        run: |
          (cd "$RUNNER_TEMP/fresh" && ifdd-meta compile installation.yaml && ifdd-meta create)
          # ui keeps ifddVersion in src/Env.js, which is instance-owned (skip
          # list), so an update leaves the old version there. model 26.11.6 adds
          # three settings to dotenv.dist; update shows them, the operator adds
          # them by hand (remove once OLD_REF is 26.11.6 or later).
          python tools/ci/compare_instances.py "$RUNNER_TEMP/old/work" "$RUNNER_TEMP/fresh/work" \
            --known frontend/src/Env.js --known model/.env
