name: Integration

# Builds and starts an installation from the templates on a fresh runner, with
# the real images, checks that every service answers through the proxy and runs
# the integration tests (ifdd-meta test) with test data.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git reference of all templates (empty: the references of config/demo)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        # umask 0007 in every step, as on the stages (tools/ci/umask0007.sh)
        shell: bash tools/ci/umask0007.sh {0}
    env:
      SETTINGS: ci-run/ifdd-meta.yaml
      # Every service that runs (ct has nothing to start); wf brings the local
      # Git server for its flows.
      START: proxy,keycloak,be,ui,schema,type,unit,ts,ts-api,wf,lab,model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          # lab adds about 7 GB (user image on the host and again in Docker-in-Docker);
          # the runner's preinstalled SDKs are not needed here.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[browser]"
          # Chromium with its system libraries; certutil puts the local CA into its NSS database.
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libnss3-tools

      - name: Runner before the run
        run: |
          mkdir -p ci-run/artefacts
          { echo "## before"; nproc; free -h; df -h /; docker version --format '{{.Server.Version}}'; docker compose version; } \
            | tee ci-run/artefacts/runner.txt

      - name: Describe and compile
        env:
          REF: ${{ inputs.ref }}
        run: |
          # The templates block of the demo, or one reference for all templates.
          if [ -z "$REF" ]; then
            TEMPLATES=$(python -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("config/demo/installation.yaml"))["templates"]))')
          else
            TEMPLATES=$(python -c 'import json, sys; print(json.dumps({"ref": sys.argv[1]}))' "$REF")
          fi
          # Names with a dot: Java clients (Kestra) send no SNI for names without one,
          # and the production proxy refuses handshakes without SNI (sniStrict).
          cat > ci-run/installation.yaml <<EOF
          installation: ci
          hosts:
            suffix: ci.test
          tls: local-ca
          services: [proxy, keycloak, be, ui, schema, type, unit, ct, ts, ts-api, wf, lab, model]
          templates: $TEMPLATES
          EOF
          ifdd-meta compile ci-run/installation.yaml
          # A further realm "dev" as on the Keycloak of several stages: its values
          # file (the template's, renamed) goes in through files:, create runs
          # build_realm.py, Keycloak imports it at its first start.
          python tools/ci/extra_realm.py "$SETTINGS" dev ci-run/realm-dev.toml
          # A further CA (as a company CA would be): the services get a copy, ct and
          # oauth2-proxy a bundle with the local CA; the login gate of wf only
          # starts if oauth2-proxy reads the local CA from that bundle.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Further CI CA" \
            -keyout /dev/null -out ci-run/further-ca.crt 2>/dev/null
          cat >> ci-run/installation.yaml <<EOF
          extra_realms: [dev]
          files:
            - {from: realm-dev.toml, to: keycloak/realm/values_dev.toml}
          ca_certs: [further-ca.crt]
          EOF
          ifdd-meta compile ci-run/installation.yaml
          ifdd-meta --settings "$SETTINGS" config check

      - name: Create
        run: |
          # Every instance becomes a Git repository; its first commit needs an identity.
          git config --global user.name "ifdd-meta CI"
          git config --global user.email "ci@example.org"
          ifdd-meta --settings "$SETTINGS" create
          # 127.0.0.1 only: the second server (step below) binds 127.0.0.2 of this
          # runner. The template takes port numbers only, so the CI edits the .env.
          sed -i -E 's/^(IFDD_PROXY_HTTPS?_PORT)=/\1=127.0.0.1:/' ci-run/work/proxy/.env
          grep -E '^IFDD_PROXY_HTTPS?_PORT=' ci-run/work/proxy/.env
          # oauth2-proxy trusts the bundle (local CA and ca_certs), not ca.crt alone.
          grep -F 'OAUTH2_PROXY_PROVIDER_CA_FILES: "/certs/ca-bundle.crt"' \
            ci-run/work/proxy/docker-compose-production.yml
          test "$(grep -c 'BEGIN CERTIFICATE' ci-run/work/proxy/certs/ca-bundle.crt)" = 2
          # the further realm: its values file and the import file build_realm.py wrote
          test -s ci-run/work/keycloak/realm/import/dev-realm.json

      - name: Local setup (/etc/hosts and the local CA)
        run: |
          # Runs the printed commands, as an operator would copy them.
          ifdd-meta --settings "$SETTINGS" local-setup | tee ci-run/artefacts/local-setup.txt
          grep -v '^#' ci-run/artefacts/local-setup.txt | bash -e
          grep -A1 '^# BEGIN ifdd-meta ci$' /etc/hosts

      - name: Build
        run: ifdd-meta --settings "$SETTINGS" build

      - name: Up
        run: ifdd-meta --settings "$SETTINGS" up --only "$START"

      - name: Status
        run: ifdd-meta --settings "$SETTINGS" status --only "$START"

      - name: Services answer through the proxy
        run: |
          ca=ci-run/work/proxy/certs/ca.crt
          # wf sits behind the login gate: oauth2-proxy answers with a redirect.
          code=$(curl -sS --cacert "$ca" -o /dev/null -w '%{http_code}' https://wf.ci.test/ || true)
          echo "$code https://wf.ci.test/ (expected 302)"
          [ "$code" = 302 ] || failed=1
          for url in \
              https://id.ci.test/realms/ifdd/.well-known/openid-configuration \
              https://id.ci.test/realms/dev/.well-known/openid-configuration \
              https://rest.ci.test/version \
              https://ui.ci.test/ \
              https://schema.ci.test/v1/ \
              https://type.ci.test/v1/ \
              https://unit.ci.test/v1/ \
              https://model.ci.test/v1/ \
              https://ts.ci.test/api/health \
              https://ts.ci.test/tsapi/version \
              https://git.ci.test/api/healthz \
              https://lab.ci.test/hub/health; do
            code=$(curl -sS --cacert "$ca" -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$code $url"
            [ "$code" = 200 ] || failed=1
          done
          [ -z "${failed:-}" ]

      - name: Mount check sees a missing directory
        run: |
          # The check of 'up' must answer 1 (not seen) where the daemon creates
          # an empty directory for a source it does not have.
          version=$(sed -n 's/^  ifdd_proxy_traefik_version: "\(.*\)"$/\1/p' ci-run/cookiecutter_all.yaml)
          code=0
          docker run --rm --network none --entrypoint /bin/sh \
            --volume "$RUNNER_TEMP/not-shared:/check:ro" "traefik:$version" \
            -c 'test -f /check/instances.json' || code=$?
          echo "exit code $code"
          [ "$code" = 1 ]

      - name: Demo data
        run: |
          ifdd-meta --settings "$SETTINGS" demo load
          # A second run sets the same password again and loads nothing new.
          ifdd-meta --settings "$SETTINGS" demo load

      - name: Integration tests
        env:
          # Writes test data (a fresh installation that is thrown away afterwards).
          IFDD_META_TESTS: write
        run: >-
          ifdd-meta --settings "$SETTINGS" test -v --junit ci-run/artefacts/junit.xml
          --screenshots ci-run/artefacts/screenshots

      - name: Second server (Keycloak, schema, type, unit of the first)
        run: |
          # Like the stages int and dev: an installation of its own that uses
          # services of the first one. Both share the Docker networks proxy-net
          # (the network aliases stand in for DNS) but not the ingest network.
          DEV=ci-dev
          python tools/ci/second_server.py ci-run/installation.yaml \
            ci-run/work/proxy/certs/ca.crt "$DEV"
          (umask 077 && ifdd-meta --settings "$SETTINGS" keycloak secrets > "$DEV/keycloak-secrets.env")
          ifdd-meta compile "$DEV/installation.yaml"
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" config check
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" create
          sed -i -E 's/^(IFDD_PROXY_HTTPS?_PORT)=/\1=127.0.0.2:/' "$DEV/work/dev_proxy/.env"
          sed -i 's/^127\.0\.0\.1 /127.0.0.2 /' "$DEV/hosts.txt"
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" local-setup > ci-run/artefacts/local-setup-dev.txt
          grep -v '^#' ci-run/artefacts/local-setup-dev.txt | bash -e
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" build
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" up
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" status
          IFDD_META_TESTS="write" ifdd-meta --settings "$DEV/ifdd-meta.yaml" test -v \
            --junit ci-run/artefacts/junit-dev.xml
          # Without --purge: proxy-net is shared with the first installation here
          # (on separate servers it is not), so it cannot be removed yet.
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" down
          ifdd-meta --settings "$DEV/ifdd-meta.yaml" local-setup --remove > ci-run/artefacts/local-setup-dev-remove.txt
          grep -v '^#' ci-run/artefacts/local-setup-dev-remove.txt | bash -e

      - name: Second server, errors
        if: failure()
        run: |
          for log in ci-dev/work/logs/*.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            grep -iE 'error|fail|traceback' "$log" | tail -n 40 || true
          done

      - name: Rebuild (the weekly run of the demo server)
        run: |
          # Tears everything down and builds it again from the same references,
          # then demo data and the read-only tests, with the same options as the
          # cron job. /etc/hosts still names the hosts; the tests trust the new
          # local CA through its file.
          ifdd-meta --settings "$SETTINGS" rebuild --prune --demo --test
          cat ci-run/state/rebuild-status.txt
          grep -qx 'result: ok' ci-run/state/rebuild-status.txt

      - name: Runner after the run
        if: always()
        run: |
          {
            echo "## after"; free -h; df -h /
            docker system df
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
            docker images --digests --format 'table {{.Repository}}:{{.Tag}}\t{{.Digest}}\t{{.Size}}'
          } | tee -a ci-run/artefacts/runner.txt

      - name: Collect logs
        if: always()
        run: |
          if [ -f ci-run/work/.ifdd-meta/instances.json ]; then
            ifdd-meta --settings "$SETTINGS" logs --output ci-run/artefacts/containers || true
          fi
          cp -r ci-run/work/logs ci-run/artefacts/ifdd-meta 2>/dev/null || true
          python tools/ci/scrub_secrets.py ci-run/work ci-run/artefacts

      - name: Error lines of the containers
        if: failure()
        run: |
          python tools/ci/show_errors.py ci-run/work ci-run/artefacts/containers
          if [ -d ci-run/work/wf ]; then
            echo "::group::Kestra: logs of the Git flows"
            docker compose --project-directory ci-run/work/wf -f ci-run/work/wf/docker-compose-production.yml \
              exec -T kestra python3 - < tools/ci/kestra_logs.py 2>&1 \
              | python tools/ci/show_errors.py ci-run/work -
            echo "::endgroup::"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ github.run_id }}
          path: ci-run/artefacts
          retention-days: 14

      - name: Down
        if: always()
        run: |
          state=ci-run/work/.ifdd-meta/instances.json
          if [ -f "$state" ]; then
            lab=$(python -c 'import json, sys; print(json.load(open(sys.argv[1])).get("lab", ""))' "$state")
            ifdd-meta --settings "$SETTINGS" down --purge
            if [ -n "$lab" ]; then
              # The homes of lab survive --purge (volume dind-data); a fresh runner discards them.
              docker volume inspect "${lab}_dind-data" > /dev/null
              echo "kept ${lab}_dind-data"
              docker volume rm "${lab}_dind-data"
            fi
          fi
