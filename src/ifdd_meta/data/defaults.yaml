# =============================================================================
# defaults.yaml – default values of all IFDD template variables
# =============================================================================
# Used by "ifdd-meta compile": it takes every value from here, replaces the
# values marked "derived" with values computed from the description of an
# installation, applies the description's overrides and writes the complete
# variables file (cookiecutter_all.yaml).
#
# Rules (the same as for the generated file):
# - Explicit over implicit: every template variable is listed here, even if
#   its value equals the template default.
# - Exception, versions: ifdd_be_version, ifdd_be_core_version, ifdd_ui_version,
#   ifdd_ct_version, ifdd_ts_api_version and ifdd_ts_core_version come from
#   the template; otherwise this file would need a change with every release.
# - Values as plain text. Jinja only for the slug derived from the template's
#   own project name, never as a reference to variables of other templates.
# - Lists are choices: the first entry is the selected value.
# - No secrets: they live only in .env or secrets/ of the instances.
# - "shared: …" names the templates that use a variable together; it is
#   listed under the service that owns the value.
# - "derived" marks values that compile computes; the value here is the one
#   for short host names (id, rest, ui, …) and a local CA.
# - Checked against the templates at v26.11.2 (keycloak, proxy, be, ui, ts-api,
#   wf) and v26.11.1 (the others, which have no release 26.11.2).

default_context:

  # ===========================================================================
  # 1. General
  # ===========================================================================

  # Registry prefix of the own images (shared: be, ct, ui); template default ghcr.io/ifdd-de
  ifdd_registry_url: "ifdd"
  # nginx image of the static content services (shared: schema, type, unit)
  ifdd_nginx_image: "nginxinc/nginx-unprivileged:1.30.6-alpine-slim"

  # ===========================================================================
  # 2. Proxy and network (Traefik)
  # ===========================================================================

  # Display name of the proxy instance
  ifdd_proxy_prj_name: "Proxy"
  # Directory name of the instance, derived from the name; also prefix of the Traefik names
  ifdd_proxy_prj_slug: "{{ cookiecutter.ifdd_proxy_prj_name|lower|replace(' ', '_') }}"

  # --- Network and hosts ---
  # External Docker network of the services (shared: all except be/ui, which use proxy-net fixed)
  ifdd_proxy_network: "proxy-net"
  # Hosts that resolve to Traefik inside the proxy network (network aliases); also SANs of the certificate (derived)
  ifdd_proxy_internal_hosts: "id, rest, ui, schema, type, unit, ts, wf, git"
  # Host of the Traefik dashboard (/dashboard/) (derived)
  ifdd_proxy_host: "proxy"
  # User of the Traefik dashboard; its password is generated into proxy/.env
  ifdd_proxy_dashboard_user: "admin"
  # Published HTTP port on the Docker host
  ifdd_proxy_port: "80"
  # Published HTTPS port on the Docker host
  ifdd_proxy_tls_port: "443"

  # --- Operation ---
  # Tag of the upstream image traefik
  ifdd_proxy_traefik_version: "v3.7.16"
  # Log level of Traefik
  ifdd_proxy_log_level: "WARN"
  # Memory limit of the Traefik container
  ifdd_proxy_memory_limit: "512M"
  # IPs/CIDRs of upstream proxies whose X-Forwarded headers are trusted (empty = none)
  ifdd_proxy_trusted_ips: ""
  # Handling of headers with underscores (X_Auth_User): delete, reject or keep
  ifdd_proxy_alias_headers_strategy:
    - "delete"
    - "reject"
    - "keep"
  # Docker API read-only through a socket proxy instead of the socket itself
  ifdd_proxy_enable_socket_proxy: "n"
  # Image of the socket proxy
  ifdd_proxy_socket_proxy_image: "ghcr.io/tecnativa/docker-socket-proxy:v0.5.0"

  # --- TLS ---
  # HTTPS with redirect from HTTP
  ifdd_proxy_enable_tls: "y"
  # Minimum TLS version: VersionTLS13 or VersionTLS12
  ifdd_proxy_tls_min_version:
    - "VersionTLS13"
    - "VersionTLS12"
  # Default certificate in certs/ (only without Let's Encrypt)
  ifdd_proxy_default_cert_file: "default.crt"
  # Key of the default certificate in certs/
  ifdd_proxy_default_key_file: "default.key"
  # Let's Encrypt instead of own certificates (needs TLS) (derived)
  ifdd_proxy_enable_letsencrypt: "n"
  # ACME account address for Let's Encrypt (derived)
  ifdd_proxy_letsencrypt_email: "admin@example.org"
  # Use the Let's Encrypt staging CA
  ifdd_proxy_letsencrypt_staging: "n"

  # --- Security headers ---
  # Middlewares for response headers (headers.yml); each service attaches them by label
  ifdd_proxy_enable_security_headers: "y"
  # Value of X-Frame-Options
  ifdd_proxy_frame_options: "SAMEORIGIN"
  # Value of Referrer-Policy
  ifdd_proxy_referrer_policy: "no-referrer"
  # Send HSTS (only for HTTPS-only hosts; off because of the local CA)
  ifdd_proxy_enable_hsts: "n"
  # max-age of HSTS in seconds
  ifdd_proxy_hsts_seconds: "31536000"
  # CSP for plain APIs (schema, type, unit)
  ifdd_proxy_csp_api: "default-src 'none'; frame-ancestors 'none'"
  # CSP for the backend incl. its Swagger UI and ReDoc pages, which ifdd-be-core
  # serves itself (no CDN); connect-src must contain the host of
  # ifdd_oidc_realm ("Authorize" in Swagger UI fetches the token there);
  # ReDoc runs its search in a worker created from a blob: URL (derived)
  ifdd_proxy_csp_api_docs: >-
    default-src 'self'; frame-ancestors 'none'; img-src 'self' data:;
    style-src 'self' 'unsafe-inline'; script-src 'self';
    connect-src 'self' https://id; worker-src 'self' blob:
  # CSP of the UI; frame-src/connect-src must match ifdd_oidc_realm and
  # ifdd_be_url, connect-src also ifdd_type_url and ifdd_unit_url (the UI
  # reads vocabularies and units there) (derived)
  ifdd_proxy_csp_ui: >-
    default-src 'self'; frame-ancestors 'none'; frame-src https://id;
    img-src 'self' data: blob:; style-src 'self' 'unsafe-inline';
    font-src 'self' data:; connect-src 'self' https://id https://rest
    https://type https://unit

  # --- Basic DoS protection (starting values, not measured) ---
  # Enable rate and in-flight limits on the entrypoint
  ifdd_proxy_enable_dos_baseline: "y"
  # Average allowed requests per period and client
  ifdd_proxy_dos_rate_average: "500"
  # Period of the rate limit
  ifdd_proxy_dos_rate_period: "1s"
  # Allowed burst above the average
  ifdd_proxy_dos_rate_burst: "1000"
  # Concurrent requests per client
  ifdd_proxy_dos_inflight_amount: "100"
  # IPv6 prefix length that counts as one client
  ifdd_proxy_dos_ipv6_subnet: "64"
  # Buffer requests before forwarding them (size limits apply)
  ifdd_proxy_dos_enable_buffering: "y"
  # Maximum size of a request body in bytes
  ifdd_proxy_dos_max_request_body_bytes: "2000000"
  # Part of the body buffered in memory, in bytes
  ifdd_proxy_dos_mem_request_body_bytes: "262144"
  # Maximum size of the request headers in bytes
  ifdd_proxy_dos_max_header_bytes: "32768"
  # Maximum concurrent HTTP/2 streams per connection
  ifdd_proxy_dos_h2_max_streams: "100"
  # Read timeout per request
  ifdd_proxy_dos_read_timeout: "15s"
  # Write timeout per response
  ifdd_proxy_dos_write_timeout: "30s"
  # Timeout of keep-alive connections without a request
  ifdd_proxy_dos_idle_timeout: "5s"

  # --- Login gate (oauth2-proxy) ---
  # Shared OIDC login gate in front of services, e.g. wf (needs TLS) (derived)
  ifdd_proxy_enable_oauth2_proxy: "y"
  # Image of oauth2-proxy
  ifdd_proxy_oauth2_proxy_image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.5-alpine"
  # CA in certs/ that oauth2-proxy also trusts when calling the realm (empty = public CAs only) (derived)
  ifdd_proxy_oauth2_proxy_ca_file: "ca.crt"
  # Realm URL (issuer) for oauth2-proxy (derived)
  ifdd_proxy_oidc_issuer: "https://id/realms/ifdd"
  # Keycloak client of oauth2-proxy (shared: keycloak)
  ifdd_proxy_oidc_client_id: "ifdd-proxy"
  # Traefik service of oauth2-proxy: <proxy slug>-oauth2-proxy (shared: wf) (derived)
  ifdd_proxy_oauth2_proxy_service: "proxy-oauth2-proxy"

  # ===========================================================================
  # 3. Identity (OIDC, Keycloak)
  # ===========================================================================

  # --- OIDC, used by several services ---
  # Realm URL, issuer of all tokens (shared: be, keycloak, ts-api, ui, wf) (derived)
  ifdd_oidc_realm: "https://id/realms/ifdd"
  # Login provider of the UI (implemented: keycloak)
  ifdd_oidc_provider: "keycloak"
  # OIDC client the UI logs in with (ui); equals ifdd_oidc_backend_client_id (derived)
  ifdd_oidc_client_id: "ifdd"
  # Public client of UI and backend in the realm (keycloak)
  ifdd_oidc_backend_client_id: "ifdd"
  # Audience the backend checks in access tokens (shared: be, keycloak); equals ifdd_oidc_backend_client_id (derived)
  ifdd_oidc_jwks_audience: "ifdd"
  # Token endpoint (shared: be, ct) (derived)
  ifdd_oidc_token_url: "https://id/realms/ifdd/protocol/openid-connect/token"
  # Authorization endpoint for the Swagger login (be) (derived)
  ifdd_oidc_authorization_url: "https://id/realms/ifdd/protocol/openid-connect/auth"
  # Refresh endpoint for the Swagger login (be) (derived)
  ifdd_oidc_refresh_url: "https://id/realms/ifdd/protocol/openid-connect/token"
  # Key endpoint (JWKS) for signature checks (be) (derived)
  ifdd_oidc_jwks_url: "https://id/realms/ifdd/protocol/openid-connect/certs"
  # Signature algorithm of the tokens (be)
  ifdd_oidc_jwks_algorithm: "RS256"

  # --- Keycloak instance ---
  # Display name of the Keycloak instance
  ifdd_keycloak_prj_name: "Keycloak"
  # Directory and router name, derived from the name
  ifdd_keycloak_prj_slug: "{{ cookiecutter.ifdd_keycloak_prj_name|lower|replace(' ', '-') }}"
  # Public host of Keycloak; must match ifdd_oidc_realm (derived)
  ifdd_keycloak_host: "id"
  # Realm name; must match ifdd_oidc_realm (derived)
  ifdd_keycloak_realm: "ifdd"
  # Further realms, comma-separated; each needs realm/values_<name>.toml in the instance (derived)
  ifdd_keycloak_extra_realms: ""
  # Keycloak image; its tag selects the built-in scopes of the realm generator
  ifdd_keycloak_image: "quay.io/keycloak/keycloak:26.8.1"
  # PostgreSQL image of the Keycloak database
  ifdd_keycloak_postgres_image: "postgres:18"
  # Port on 127.0.0.1 in development
  ifdd_keycloak_dev_port: "8096"
  # Temporary admin of the master realm
  ifdd_keycloak_admin_user: "admin"

  # --- Backup of the Keycloak database ---
  # Image of the backup service; its tag starts with the major version of
  # ifdd_keycloak_postgres_image (pg_dump must not be older than the server)
  ifdd_keycloak_backup_image: "prodrigestivill/postgres-backup-local:18"
  # When the database is dumped: cron expression or descriptor; also on every start
  ifdd_keycloak_backup_schedule: "@daily"
  # Time zone of the schedule and of the dates in the file names of the dumps
  ifdd_keycloak_backup_timezone: "Europe/Berlin"
  # Days the daily dumps are kept
  ifdd_keycloak_backup_keep_days: "7"
  # Weeks the weekly dumps are kept
  ifdd_keycloak_backup_keep_weeks: "4"
  # Months the monthly dumps are kept
  ifdd_keycloak_backup_keep_months: "6"

  # --- Roles and groups in the realm ---
  # Write role for nodes (realm and client role)
  ifdd_keycloak_role_nodes_write: "ifdd_nodes_rw"
  # Role "logged in, no domain permissions" (default role)
  ifdd_keycloak_role_public: "ifdd_public"
  # Role for privileged nodes
  ifdd_keycloak_role_nodes_priv: "ifdd_nodes_priv"
  # Group with read permission
  ifdd_keycloak_group_nodes_readers: "ifdd_nodes_readers"
  # Group with read and write permission
  ifdd_keycloak_group_nodes_writers: "ifdd_nodes_writers"
  # Group with read and privileged permission
  ifdd_keycloak_group_nodes_privileged: "ifdd_nodes_privileged"
  # Group with access to wf; keep equal to ifdd_wf_sso_group
  ifdd_keycloak_wf_admin_group: "ifdd_wf_admins"

  # --- Further clients ---
  # Confidential client for scripts (read only)
  ifdd_keycloak_api_client_id: "ifdd-api-script"
  # Confidential client of ct with write role (shared: ct)
  ifdd_keycloak_ct_client_id: "ifdd-ct"
  # Confidential client for keycloak_add_user.py (create users, assign groups)
  ifdd_keycloak_useradmin_client_id: "ifdd-user-admin"
  # Confidential client for services writing samples through ts-api (write role, root)
  ifdd_keycloak_ts_ingest_client_id: "ifdd-ts-ingest"
  # Hosts behind the oauth2-proxy gate, comma-separated (redirect URIs of ifdd-proxy) (derived)
  ifdd_keycloak_proxy_gate_hosts: "wf"

  # ===========================================================================
  # 4. Backend (be)
  # ===========================================================================

  # Display name of the backend instance
  ifdd_be_prj_name: "Backend"
  # Directory and image name, derived from the name
  ifdd_be_prj_slug: "{{ cookiecutter.ifdd_be_prj_name|lower|replace(' ', '-') }}"

  # --- Host and URL ---
  # Host name under which Traefik routes the backend (derived)
  ifdd_be_host: "rest"
  # Public base URL; base of the @id of all documents (shared: ct, keycloak, ui, wf) (derived)
  ifdd_be_url: "https://rest"
  # Internal port of uvicorn
  ifdd_be_port: "8881"

  # --- Operation ---
  # Log level of the backend
  ifdd_be_log_level: "debug"
  # Number of uvicorn workers
  ifdd_be_max_workers: "4"
  # Check tokens (n = development user with all roles)
  ifdd_be_enable_auth: "y"
  # Keep replaced versions as history (y) or delete them (n)
  ifdd_be_enable_versioning: "y"
  # REST path segment -> aspect as JSON, in single quotes (shared: ct)
  ifdd_be_aspects: '{"products": "product", "functions": "function", "locations": "location", "organisations": "organisation"}'

  # --- Roles (client roles of ifdd_oidc_jwks_audience) ---
  # Read role (shared: keycloak)
  ifdd_be_role_nodes_read: "ifdd_nodes_ro"
  # Write role for PUT, PATCH, DELETE
  ifdd_be_role_nodes_write: "ifdd_nodes_rw"
  # Role for /prot_version (logged in, no domain permissions)
  ifdd_be_role_public: "ifdd_public"
  # Root of the context names: context pattern for every domain context
  # (client role with a dot); pattern of the development user of be, role
  # and group ifdd_ctx_<root> in keycloak (shared: be, keycloak, ts-api) (derived)
  ifdd_context_root: "ifdd.de"

  # --- Database ---
  # PostgreSQL image (at least 13; volume at /var/lib/postgresql)
  ifdd_be_postgres_image: "postgres:18"
  # Host name of the database in the internal network
  ifdd_be_postgres_host: "db"
  # Port of the database
  ifdd_be_postgres_port: "5432"
  # Name of the database
  ifdd_be_postgres_db: "Test"
  # Database user (the hook generates the password in .env)
  ifdd_be_postgres_user: "ifdd"

  # --- Deprecated or without effect (until removed from the template) ---
  # Deprecated: TLS labels on a router replace the proxy's TLS settings
  ifdd_be_enable_tls: "n"
  # Deprecated: Let's Encrypt labels on the router, same reason
  ifdd_be_enable_letsencrypt: "n"
  # Without effect: defined in the template, but used nowhere
  ifdd_be_enable_postgres: "y"
  # Without effect: defined in the template, but used nowhere
  ifdd_be_enable_rest_server: "y"

  # ===========================================================================
  # 5. Frontend (ui)
  # ===========================================================================

  # Display name of the UI instance
  ifdd_ui_prj_name: "Frontend"
  # Directory and image name, derived from the name
  ifdd_ui_prj_slug: "{{ cookiecutter.ifdd_ui_prj_name|lower|replace(' ', '-') }}"
  # Host name under which Traefik routes the UI (derived)
  ifdd_ui_host: "ui"
  # Browser origin of the UI, the backend's only CORS origin (shared: be, keycloak) (derived)
  ifdd_ui_url: "https://ui"
  # Title of the application in the browser
  ifdd_ui_title: "IFDD"
  # Aspects shown, as a JSON list in single quotes
  ifdd_ui_aspects: '["product", "function", "location", "organisation", "project"]'
  # Show the graph tab (explorer)
  ifdd_ui_show_explorer: "n"
  # Deprecated: TLS labels on a router replace the proxy's TLS settings
  ifdd_ui_enable_tls: "n"
  # Deprecated: Let's Encrypt labels on the router, same reason
  ifdd_ui_enable_letsencrypt: "n"

  # ===========================================================================
  # 6. Core Tools (ct)
  # ===========================================================================

  # Display name of the ct instance
  ifdd_ct_prj_name: "CT"
  # Directory and image name, derived from the name
  ifdd_ct_prj_slug: "{{ cookiecutter.ifdd_ct_prj_name|lower|replace(' ', '-') }}"
  # Log level of ifdd-ct
  ifdd_ct_log_level: "DEBUG"

  # ===========================================================================
  # 7. Static content (schema, type, unit; nginx)
  # ===========================================================================

  # --- schema: JSON-LD contexts ---
  # Display name of the schema instance
  ifdd_schema_prj_name: "Schema"
  # Directory and router name, derived from the name
  ifdd_schema_prj_slug: "{{ cookiecutter.ifdd_schema_prj_name|lower|replace(' ', '-') }}"
  # Host name under which Traefik routes schema (derived)
  ifdd_schema_host: "schema"
  # Base URL of the contexts, without trailing slash (shared: be, ct, model, ui) (derived)
  ifdd_schema_url: "https://schema/v1"
  # Port on 127.0.0.1 in development
  ifdd_schema_dev_port: "8081"
  # Content directory (development: examples; production: own content clone)
  ifdd_schema_content_dir: "./examples/json-ld"
  # Show directory listings
  ifdd_schema_autoindex: "y"
  # Access-Control-Allow-Origin: * or one origin
  ifdd_schema_cors_origin: "*"
  # Cache-Control max-age in seconds (0 = no-cache)
  ifdd_schema_cache_max_age: "300"
  # Memory limit of the container
  ifdd_schema_memory_limit: "128M"

  # --- type: type vocabularies ---
  # Display name of the type instance
  ifdd_type_prj_name: "Type"
  # Directory and router name, derived from the name
  ifdd_type_prj_slug: "{{ cookiecutter.ifdd_type_prj_name|lower|replace(' ', '-') }}"
  # Host name under which Traefik routes type (derived)
  ifdd_type_host: "type"
  # Base URL of the types, without trailing slash (shared: be, ct, model, schema, ts-api, ui) (derived)
  ifdd_type_url: "https://type/v1"
  # Port on 127.0.0.1 in development
  ifdd_type_dev_port: "8082"
  # Content directory (development: examples; production: own content clone)
  ifdd_type_content_dir: "./examples/json-ld"
  # Show directory listings
  ifdd_type_autoindex: "y"
  # Access-Control-Allow-Origin: * or one origin
  ifdd_type_cors_origin: "*"
  # Cache-Control max-age in seconds (0 = no-cache)
  ifdd_type_cache_max_age: "300"
  # Memory limit of the container
  ifdd_type_memory_limit: "128M"

  # --- unit: units ---
  # Display name of the unit instance
  ifdd_unit_prj_name: "Unit"
  # Directory and router name, derived from the name
  ifdd_unit_prj_slug: "{{ cookiecutter.ifdd_unit_prj_name|lower|replace(' ', '-') }}"
  # Host name under which Traefik routes unit (derived)
  ifdd_unit_host: "unit"
  # Base URL of the units, without trailing slash (shared: ct, model, type, ui) (derived)
  ifdd_unit_url: "https://unit/v1"
  # Port on 127.0.0.1 in development
  ifdd_unit_dev_port: "8083"
  # Content directory (development: examples; production: own content clone)
  ifdd_unit_content_dir: "./examples/json-ld"
  # Show directory listings
  ifdd_unit_autoindex: "y"
  # Access-Control-Allow-Origin: * or one origin
  ifdd_unit_cors_origin: "*"
  # Cache-Control max-age in seconds (0 = no-cache)
  ifdd_unit_cache_max_age: "300"
  # Memory limit of the container
  ifdd_unit_memory_limit: "128M"

  # ===========================================================================
  # 8. Time series (ts: VictoriaMetrics, Grafana)
  # ===========================================================================

  # Display name of the ts instance
  ifdd_ts_prj_name: "Time Series"
  # Directory and router name, derived from the name
  ifdd_ts_prj_slug: "{{ cookiecutter.ifdd_ts_prj_name|lower|replace(' ', '-') }}"
  # Host name under which Traefik routes Grafana (shared: keycloak, ts-api) (derived)
  ifdd_ts_host: "ts"

  # --- Images and resources ---
  # Grafana image
  ifdd_ts_grafana_image: "grafana/grafana:13.3.0"
  # VictoriaMetrics image
  ifdd_ts_vm_image: "victoriametrics/victoria-metrics:v1.155.0"
  # Memory limit of Grafana
  ifdd_ts_grafana_memory_limit: "1G"
  # Memory limit of VictoriaMetrics
  ifdd_ts_vm_memory_limit: "2G"
  # Data directory of VictoriaMetrics
  ifdd_ts_vm_data_dir: "./vm_data"
  # Retention of the measurements (h, d, w, M, y)
  ifdd_ts_retention: "10y"

  # --- Network and ports ---
  # Docker network through which writing containers reach VictoriaMetrics
  ifdd_ts_ingest_network: "ts-ingest"
  # Grafana port on 127.0.0.1 in development
  ifdd_ts_grafana_dev_port: "8091"
  # VictoriaMetrics port on 127.0.0.1 in development
  ifdd_ts_vm_dev_port: "8092"
  # Backend as seen from Grafana, without trailing slash; equals ifdd_be_url (derived)
  ifdd_ts_be_url: "https://rest"

  # --- Login and roles (Grafana) ---
  # Realm URL (issuer) for the Grafana login (derived)
  ifdd_ts_oidc_issuer: "https://id/realms/ifdd"
  # Keycloak client for login and for reading from the backend (shared: keycloak)
  ifdd_ts_oidc_client_id: "ifdd-ts"
  # Token claim with the roles
  ifdd_ts_roles_claim: "realm_access.roles"
  # Realm role for Grafana admin (shared: keycloak)
  ifdd_ts_role_admin: "admin"
  # Realm role for Grafana editor (shared: keycloak)
  ifdd_ts_role_editor: "readwrite"
  # Realm role for Grafana viewer (shared: keycloak)
  ifdd_ts_role_viewer: "readonly"

  # ===========================================================================
  # 8b. Time series API (ts-api, on ifdd-ts-core)
  # ===========================================================================

  # Display name of the ts-api instance
  ifdd_ts_api_prj_name: "Time Series API"
  # Directory and router name, derived from the name
  ifdd_ts_api_prj_slug: "{{ cookiecutter.ifdd_ts_api_prj_name|lower|replace(' ', '-') }}"
  # Path prefix on the host of Grafana (ifdd_ts_host); Traefik routes it to ts-api
  ifdd_ts_api_path: "/tsapi"
  # Public URL: https:// + ifdd_ts_host + ifdd_ts_api_path (shared: ct) (derived)
  ifdd_ts_api_url: "https://ts/tsapi"
  # Internal port of uvicorn; also the port on 127.0.0.1 in development
  ifdd_ts_api_port: "8093"
  # uvicorn processes
  ifdd_ts_api_max_workers: "2"
  # uvicorn log level
  ifdd_ts_api_log_level: "info"
  # Most samples written or read, and most series listed, per request (not measured)
  ifdd_ts_api_max_items: "10000"
  # VictoriaMetrics on the ingest network
  ifdd_ts_api_vm_url: "http://victoriametrics:8428"
  # Keycloak client that carries the roles of ts-api; audience of its tokens (shared: keycloak)
  ifdd_ts_api_oidc_client_id: "ifdd-ts-api"
  # Client role to read samples (shared: keycloak)
  ifdd_ts_api_role_read: "ifdd_ts_ro"
  # Client role to write samples (shared: keycloak)
  ifdd_ts_api_role_write: "ifdd_ts_rw"

  # ===========================================================================
  # 9. Workflows (wf: Kestra)
  # ===========================================================================

  # Display name of the wf instance
  ifdd_wf_prj_name: "WF"
  # Directory name of the instance, derived from the name
  ifdd_wf_prj_slug: "{{ cookiecutter.ifdd_wf_prj_name|lower|replace(' ', '-') }}"
  # Host name under which Traefik routes Kestra; always at the root (shared: keycloak) (derived)
  ifdd_wf_host: "wf"
  # Traefik entrypoint of the routers
  ifdd_wf_entrypoint: "websecure"
  # Port on 127.0.0.1 in development
  ifdd_wf_dev_port: "8095"
  # User name of the Kestra basic auth (must be an email address)
  ifdd_wf_admin_email: "admin@example.org"

  # --- Images ---
  # Kestra image (full, with plugins)
  ifdd_wf_kestra_image: "kestra/kestra:v2.0.8"
  # PostgreSQL image of the Kestra database
  ifdd_wf_postgres_image: "postgres:18"
  # Docker-in-Docker image
  ifdd_wf_dind_image: "docker:29.9.2-dind"
  # Base image of the papermill runner
  ifdd_wf_runner_python_image: "python:3.14-slim"

  # --- Docker access (equivalent to root) ---
  # dind: own Docker daemon; socket: Docker socket of the host
  ifdd_wf_docker_mode:
    - "dind"
    - "socket"
  # Flows may mount volumes into task containers
  ifdd_wf_docker_volume_enabled: "y"

  # --- SSO through oauth2-proxy (needs ifdd_proxy_enable_oauth2_proxy) ---
  # Enable forward auth through oauth2-proxy
  ifdd_wf_enable_sso: "y"
  # Keycloak group with access; equals ifdd_keycloak_wf_admin_group (derived)
  ifdd_wf_sso_group: "ifdd_wf_admins"
  # oauth2-proxy as seen from Traefik
  ifdd_wf_sso_auth_address: "http://oauth2-proxy:4180"
  # Deprecated: replaced by ifdd_proxy_oauth2_proxy_service; the hook warns if it is changed
  ifdd_wf_sso_service: "oauth2-proxy@docker"

  # --- Git synchronisation of the flows (production only) ---
  # Repository of the flows, https without credentials; the token goes into secrets/kestra.env
  # (derived with the local Git server of ifdd-meta, wf_git: local)
  ifdd_wf_git_url: "https://git/kestra/flows.git"
  # User name for the Git server; the owner of the repository (derived with wf_git: local)
  ifdd_wf_git_username: "kestra"
  # Branch of the flows; it needs a first commit before the first start
  ifdd_wf_git_branch: "main"
  # Root namespaces that are pushed and restored, comma-separated
  ifdd_wf_git_namespaces: "ifdd"

  # ===========================================================================
  # 10. Model (LinkML sources)
  # ===========================================================================

  # Display name of the model instance; its slug must differ from the package name ifdd_model
  ifdd_model_prj_name: "Model"
  # Directory name of the instance, derived from the name
  ifdd_model_prj_slug: "{{ cookiecutter.ifdd_model_prj_name|lower|replace(' ', '_') }}"
